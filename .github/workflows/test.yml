name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm --dir my-agent install --frozen-lockfile
      - run: npm ci --prefix hosted-agent
      - run: npm test --prefix my-agent
      - run: npm test --prefix hosted-agent
      - run: npm run check --prefix my-agent
      - run: npm run build --prefix hosted-agent
