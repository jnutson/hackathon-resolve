amily="Arial, sans-serif" font-size="17" fill="#1e293b">LiveKit inference</text><text x="58" y="571.2" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Caller audio → transcript</text><rect x="390" y="460" width="355" height="135" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="2"/><text x="408" y="496.0" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Reply interpretation</text><text x="408" y="527.0" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Gemma 3 27B via Nebius</text><text x="408" y="549.1" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Stage-specific JSON intent</text><text x="408" y="571.2" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">4-second timeout → clarify</text><rect x="815" y="460" width="335" height="165" rx="12" fill="#f0fdf4" stroke="#334155" stroke-width="2"/><text x="833" y="496.0" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">SupportAgent + guide</text><text x="833" y="527.0" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Deterministic JavaScript stages</text><text x="833" y="549.1" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Identify → brightness → menu</text><text x="833" y="571.2" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">System → Touch → enable</text><text x="833" y="593.3" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Swipe test → preference</text><rect x="1215" y="460" width="290" height="165" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="2"/><text x="1233" y="496.0" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Speech output</text><text x="1233" y="527.0" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Prepared stage instruction</text><text x="1233" y="549.1" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">OR general Gemma response</text><text x="1233" y="571.2" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">↓</text><text x="1233" y="593.3" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Cartesia Sonic-3 → caller</text><path d="M325,525 L390,525" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M745,525 L815,525" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M1150,525 L1215,525" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="672.0" font-family="Arial, sans-serif" font-size="17" fill="#64748b">Gemma uses LiveKit’s OpenAI-compatible adapter with a Nebius endpoint; no OpenAI fallback.</text><text x="40" y="738.0" font-family="Arial, sans-serif" font-size="18" fill="#2563eb">3  TWO MODEL-CALLABLE TOOLS · LIVEKIT llm.tool() · NOT MCP</text><rect x="40" y="770" width="410" height="165" rx="12" fill="#fff7ed" stroke="#334155" stroke-width="2"/><text x="58" y="806.0" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">lookup_garmin_support</text><text x="58" y="837.0" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Inputs: topic, model, symptom, firmware</text><text x="58" y="859.1" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Starts priority + background retrieval</text><text x="58" y="881.2" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Also callable by application turn logic</text><rect x="40" y="970" width="410" height="135" rx="12" fill="#fff7ed" stroke="#334155" stroke-width="2"/><text x="58" y="1006.0" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">read_garmin_background</text><text x="58" y="1037.0" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Returns an immediate cached snapshot</text><text x="58" y="1059.1" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">No new network request; no waiting</text><rect x="530" y="770" width="440" height="165" rx="12" fill="#fff7ed" stroke="#334155" stroke-width="2"/><text x="548" y="806.0" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Priority retrieval · Keenable</text><text x="548" y="837.0" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Official procedure + button controls</text><text x="548" y="859.1" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Concurrent search and full-page fetch</text><text x="548" y="881.2" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Model / URL / article validation</text><text x="548" y="903.3" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">~7-second budget; per-call cache</text><rect x="530" y="970" width="440" height="165" rx="12" fill="#fff7ed" stroke="#334155" stroke-width="2"/><text x="548" y="1006.0" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Background retrieval · Keenable</text><text x="548" y="1037.0" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Conditions · firmware · reports · support</text><text x="548" y="1059.1" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">~6-second budget; cancel stale searches</text><text x="548" y="1081.2" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Snippets suggest questions, not repairs</text><text x="548" y="1103.3" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Completion does not trigger speech</text><path d="M450,835 L530,835" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M450,875 L530,1040" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M530,1070 L450,1070" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="1050" y="770" width="455" height="165" rx="12" fill="#fefce8" stroke="#334155" stroke-width="2"/><text x="1068" y="806.0" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Important execution boundary</text><text x="1068" y="837.0" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">The scripted touch flow can bypass</text><text x="1068" y="859.1" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">live retrieval and the general LLM.</text><text x="1068" y="881.2" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">A lookup is not a mandatory gate</text><text x="1068" y="903.3" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">before each prepared instruction.</text><rect x="1050" y="970" width="455" height="165" rx="12" fill="#f0fdf4" stroke="#334155" stroke-width="2"/><text x="1068" y="1006.0" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Outcome storage</text><text x="1068" y="1037.0" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Local .data/call-outcomes.jsonl</text><text x="1068" y="1059.1" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Stage; touch before / after; swipe result</text><text x="1068" y="1081.2" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Keep / return / support preference</text><text x="1068" y="1103.3" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Resolution is caller-confirmed.</text><path d="M990,625 L990,970" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M990,970 L1050,1035" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="1213.0" font-family="Arial, sans-serif" font-size="18" fill="#2563eb">CURRENT SCOPE</text><text x="40" y="1249.0" font-family="Arial, sans-serif" font-size="19" fill="#1e293b">Audio-only outbound call • No camera-verified diagnosis • No retailer return mutation • No support-ticket creation</text><text x="40" y="1286.0" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Source: my-agent/agent.mjs, models.mjs, support/*.mjs and hosted-agent/worker.mjs · inspected October 23, 2026</text></svg>